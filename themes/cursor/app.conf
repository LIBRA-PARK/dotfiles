# Cursor — 테마 적용 정보 (setting.sh 가 source 한다)
#
# 테마 파일(<테마>.json)은 settings.json 에 병합할 키만 담은 순수 JSON 이다.
# jq 로 병합하므로 주석을 쓰지 않는다.
#
# TARGET 은 레포의 cursor/settings.json 으로 링크돼 있으므로
# 병합하면 레포 파일이 바뀐다. 적용한 테마가 git diff 로 그대로 보인다.
#
# 테마 확장은 cursor/extensions.txt 에 함께 등록해 둔다.
#   nord: arcticicestudio.nord-visual-studio-code

APP_NAME="Cursor"
THEME_EXT="json"
PLATFORM="macos"

APPLY_METHOD="merge-json"
TARGET="$HOME/Library/Application Support/Cursor/User/settings.json"
JSON_PATH="."
NOTE="Cursor 는 저장 즉시 반영된다"
