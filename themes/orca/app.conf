# Orca — 테마 적용 정보 (scripts/lib/theme.sh 가 source 한다)
#
# 테마 파일(<테마>.json)은 orca-data.json 의 settings 에 병합할 키만 담는다.
# terminalThemeDark/Light 값은 Orca 내장 터미널 테마 이름이다.
# (설정 > Terminal > Theme 목록과 같은 이름)
#
# orca-data.json 은 Orca 가 실행 중에 계속 덮어쓴다.
# 반드시 Orca 를 완전히 종료한 뒤 병합해야 반영된다. (PROCESS 로 감지)

APP_NAME="Orca"
THEME_EXT="json"
PLATFORM="macos"

APPLY_METHOD="merge-json"
TARGET="$HOME/Library/Application Support/orca/profiles/local-default/orca-data.json"
JSON_PATH=".settings"
NOTE="Orca 를 다시 실행하면 반영된다"

# 이 프로세스가 떠 있으면 적용을 건너뛴다 (pgrep -f 정규식, 명령줄 맨 앞만 본다).
# Orca 데몬(Orca Helper)은 인자에 같은 경로가 들어 있어 맨 앞으로 고정한다. --force 로 무시할 수 있다.
PROCESS="^[^ ]*/Orca\.app/Contents/MacOS/Orca( |$)"
