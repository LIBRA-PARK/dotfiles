# One Dark Pro — Ghostty 테마 조각
#
# VS Code 확장(zhuangtongfa.material-theme)의 One Dark Pro 터미널 색을 그대로 옮겼다.
# Ghostty 내장 테마의 One Dark 계열과는 색이 조금 달라 팔레트를 직접 지정한다.
# 기본 설정의 theme = Nord 위에 덮어쓰므로 모든 색을 빠짐없이 지정한다.
# 선택 영역은 확장의 반투명 값(#abb2bf30)을 배경에 겹친 색이다.

background = #282c34
foreground = #abb2bf
cursor-color = #528bff
cursor-text = #282c34
selection-background = #41454e
selection-foreground = #abb2bf

palette = 0=#3f4451
palette = 1=#e05561
palette = 2=#8cc265
palette = 3=#d18f52
palette = 4=#4aa5f0
palette = 5=#c162de
palette = 6=#42b3c2
palette = 7=#d7dae0
palette = 8=#4f5666
palette = 9=#ff616e
palette = 10=#a5e075
palette = 11=#f0a45d
palette = 12=#4dc4ff
palette = 13=#de73ff
palette = 14=#4cd1e0
palette = 15=#e6e6e6
