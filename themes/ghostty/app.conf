# Ghostty — 테마 적용 정보 (scripts/lib/theme.sh 가 source 한다)
#
# 테마 파일(<테마>.conf)은 Ghostty 설정 문법의 조각이다.
# 대상 위치에 링크하면 applications/ghostty/config 의 config-file 줄이 읽어 들여
# 기본 테마(theme = Nord)를 덮어쓴다.

APP_NAME="Ghostty"
THEME_EXT="conf"
PLATFORM="macos linux"

# link       : 테마 파일을 TARGET 에 심볼릭 링크
# merge-json : 테마 JSON 을 TARGET 의 JSON_PATH 위치에 병합
# manual     : 자동 적용 불가. NOTE 의 안내를 출력
APPLY_METHOD="link"
TARGET="$HOME/.config/ghostty/theme.conf"
NOTE="적용 후 Ghostty 에서 cmd+shift+, 로 리로드"
