# VS Code — 테마 적용 정보 (setting.sh 가 source 한다)
#
# 테마 파일(<테마>.json)은 settings.json 에 병합할 키만 담은 순수 JSON 이다.
# jq 로 병합하므로 주석을 쓰지 않는다. (Cursor 와 같은 키를 쓴다)
#
# 레포에 applications/vscode/settings.json 이 생기면 TARGET 이 그 파일로 링크되므로
# 병합하면 레포 파일이 바뀐다. 지금은 레포에 없어 로컬 파일에만 병합된다.
#
# 테마 확장은 applications/vscode/extensions.txt 에 함께 등록해 둔다.
#   nord: arcticicestudio.nord-visual-studio-code

APP_NAME="VS Code"
THEME_EXT="json"
PLATFORM="macos"

APPLY_METHOD="merge-json"
TARGET="$HOME/Library/Application Support/Code/User/settings.json"
JSON_PATH="."
NOTE="VS Code 는 저장 즉시 반영된다"
