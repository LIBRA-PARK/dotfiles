# VS Code — 테마 적용 정보 (scripts/lib/theme.sh 가 source 한다)
#
# 테마 파일(<테마>.json)은 settings.json 에 넣을 최상위 키만 담은 순수 JSON 이다.
# settings.json 은 주석이 있는 JSONC 라 jq 로 병합할 수 없으므로
# merge-jsonc 로 키 한 줄씩 바꾸거나 추가한다. (주석과 나머지 내용은 보존) (Cursor 와 같은 키를 쓴다)
#
# 레포에 applications/vscode/settings.json 이 생기면 TARGET 이 그 파일로 링크되므로
# 병합하면 레포 파일이 바뀐다. 지금은 레포에 없어 로컬 파일에만 병합된다.
#
# 테마 확장은 THEME_EXTENSIONS 에 "<테마>=<확장 ID>" 로 적는다.
# 적용할 때 EXT_CLI 가 있으면 해당 확장을 설치한다.
# 새 머신용으로 applications/vscode/extensions.txt 에도 함께 등록해 둔다.

APP_NAME="VS Code"
THEME_EXT="json"
PLATFORM="macos windows"

APPLY_METHOD="merge-jsonc"
# OS 별 위치는 scripts/lib/common.sh 의 app_config_dir 이 정한다.
TARGET="$(app_config_dir)/Code/User/settings.json"
NOTE="VS Code 는 저장 즉시 반영된다"

EXT_CLI="code"
THEME_EXTENSIONS="nord=arcticicestudio.nord-visual-studio-code tokyo-night-light=enkia.tokyo-night"
