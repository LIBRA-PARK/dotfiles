# MobaXterm — 테마 적용 정보 (setting.sh 가 source 한다)
#
# 테마 파일(<테마>.mxtcolors)은 MobaXterm.ini 의 [Colors] 섹션 그대로다.
# Windows 전용 앱이라 macOS/Linux 의 setting.sh 로는 적용하지 않는다.

APP_NAME="MobaXterm"
THEME_EXT="mxtcolors"
PLATFORM="windows"

APPLY_METHOD="manual"
TARGET='%APPDATA%\MobaXterm\MobaXterm.ini'
NOTE="MobaXterm 을 종료하고 MobaXterm.ini 의 [Colors] 섹션을 이 파일 내용으로 교체"
