<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  dotfiles 폰트 설정 (fontconfig / Linux 전용)

  ~/.config/fontconfig/conf.d/10-dotfiles-fonts.conf 로 링크해서 사용합니다.
  font/install.sh 가 자동으로 링크하고 fc-cache 를 갱신합니다.

  기본   : JetBrainsMono Nerd Font        (영문 + Nerd 아이콘, 한글 없음)
  fallback: D2KodingLigature Nerd Font    (한글 + Nerd 아이콘)

  macOS 는 fontconfig 를 쓰지 않습니다. Ghostty / VS Code 등 앱별 설정으로
  같은 순서를 지정하세요. (README 의 "앱별 설정" 표 참고)
-->

<fontconfig>

  <!-- 레포 안의 폰트를 직접 스캔하고 싶을 때 쓰는 경로.
       install.sh 가 홈 폰트 디렉토리로 링크하므로 보통은 필요 없습니다. -->
  <!-- <dir>~/dotfiles/font</dir> -->

  <!--
    generic 'monospace' 요청을 우리 조합으로 넘긴다.
    터미널/에디터가 'monospace' 만 지정해도 같은 폰트가 잡힌다.
  -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>D2KodingLigature Nerd Font</family>
    </prefer>
  </alias>

  <!--
    핵심 규칙: JetBrainsMono Nerd Font 에 없는 글리프(한글)는
    D2KodingLigature Nerd Font 로 넘어가게 한다.

    주의: <prefer> 는 "뒤에 추가" 가 아니라 prepend(앞에 삽입)다.
    fallback 은 반드시 <accept>(append)를 써야 한다.
    <prefer> 를 쓰면 D2Koding 이 기본 폰트보다 먼저 잡혀 영문까지 D2Koding 으로 렌더된다.

    binding="same" 은 기본값 weak 과 달리 lang 매칭에 밀려 순서가
    뒤바뀌는 것을 막아준다. (weak 이면 시스템 한글 폰트가 먼저 잡힐 수 있음)
  -->
  <alias binding="same">
    <family>JetBrainsMono Nerd Font</family>
    <accept>
      <family>D2KodingLigature Nerd Font</family>
    </accept>
  </alias>

  <!--
    이름 별칭. 요청된 이름을 실제 패밀리로 바꿔치기하는 것이므로
    여기서는 prepend 인 <prefer> 가 맞다.
    Nerd Fonts 패치본의 실제 패밀리명은 'D2Coding' 이 아니라 'D2Koding' 이다.
    기존 설정에 익숙한 이름을 그대로 써도 동작하도록 매핑해 둔다.
  -->
  <alias binding="same">
    <family>JetBrainsMono NF</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>

  <alias binding="same">
    <family>JetBrains Mono</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>

  <alias binding="same">
    <family>D2Coding</family>
    <prefer><family>D2KodingLigature Nerd Font</family></prefer>
  </alias>

  <alias binding="same">
    <family>D2Coding Nerd Font</family>
    <prefer><family>D2KodingLigature Nerd Font</family></prefer>
  </alias>

  <!--
    한국어 문서의 기본 monospace 를 D2Koding 으로.
    영문은 위 규칙대로 JetBrainsMono 가 먼저 잡힌다.
  -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>D2KodingLigature Nerd Font</string>
    </edit>
  </match>

  <!-- 두 폰트 모두 힌팅이 잘 되어 있으므로 서브픽셀 렌더링만 켜 둔다. -->
  <match target="font">
    <test name="family" compare="eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

  <match target="font">
    <test name="family" compare="eq">
      <string>D2KodingLigature Nerd Font</string>
    </test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

</fontconfig>
